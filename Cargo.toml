[workspace]
resolver = "2"
members = [
    "src/parser",
    "src/loader/compatibility",
    "src/loader/api",
    "src/loader",
    "src/loader/package",
    "src/loader/modules/commands",
    "src/loader/modules/debug-console",
    "src/loader/modules/modloader-ui",
    "src/loader/modules/updater",
    "src/loader/modules/runtime-diagnostics",
]
exclude = [
    "src/parser/kfc-parser",
    "src/parser/kfc-parser/crates/*",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.88.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
semver = { version = "1.0", features = ["serde"] }
shroudforge-package = { path = "src/loader/package" }
