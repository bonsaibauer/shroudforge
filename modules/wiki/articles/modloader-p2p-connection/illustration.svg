<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Example Enshrouded server admin group</title>
  <desc id="description">A server userGroups JSON example. All five Modloader admin permissions are true. The password is a placeholder.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17262b"/>
      <stop offset="1" stop-color="#0a1216"/>
    </linearGradient>
    <linearGradient id="editor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#111b20"/>
      <stop offset="1" stop-color="#0b1216"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#background)"/>
  <rect x="28" y="28" width="1144" height="464" rx="16" fill="url(#editor)" stroke="#52666b" stroke-opacity=".58"/>
  <path d="M28 86h1144" stroke="#52666b" stroke-opacity=".45"/>
  <circle cx="62" cy="57" r="7" fill="#d98578"/>
  <circle cx="88" cy="57" r="7" fill="#d8b56c"/>
  <circle cx="114" cy="57" r="7" fill="#59c398"/>
  <text x="150" y="63" fill="#9fb2b2" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" letter-spacing="2">SERVER CONFIG · USER GROUP EXAMPLE</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="23">
    <g fill="#71858a" text-anchor="end">
      <text x="78" y="132">1</text><text x="78" y="164">2</text><text x="78" y="196">3</text>
      <text x="78" y="228">4</text><text x="78" y="260">5</text><text x="78" y="292">6</text>
      <text x="78" y="324">7</text><text x="78" y="356">8</text><text x="78" y="388">9</text>
      <text x="78" y="420">10</text><text x="78" y="452">11</text><text x="78" y="484">12</text>
    </g>
    <g fill="#d7e2df">
      <text x="104" y="132"><tspan fill="#c5a9ed">"userGroups"</tspan>: [</text><text x="128" y="164">{</text>
      <text x="152" y="196"><tspan fill="#c5a9ed">"name"</tspan>: <tspan fill="#d8b56c">"Admin"</tspan>,</text>
      <text x="152" y="228"><tspan fill="#c5a9ed">"password"</tspan>: <tspan fill="#d8b56c">"REPLACE_WITH_A_PRIVATE_PASSWORD"</tspan>,</text>
      <text x="152" y="260"><tspan fill="#c5a9ed">"canKickBan"</tspan>: <tspan fill="#8fd8b7">true</tspan>,</text>
      <text x="152" y="292"><tspan fill="#c5a9ed">"canAccessInventories"</tspan>: <tspan fill="#8fd8b7">true</tspan>,</text>
      <text x="152" y="324"><tspan fill="#c5a9ed">"canEditWorld"</tspan>: <tspan fill="#8fd8b7">true</tspan>,</text>
      <text x="152" y="356"><tspan fill="#c5a9ed">"canEditBase"</tspan>: <tspan fill="#8fd8b7">true</tspan>,</text>
      <text x="152" y="388"><tspan fill="#c5a9ed">"canExtendBase"</tspan>: <tspan fill="#8fd8b7">true</tspan>,</text>
      <text x="152" y="420"><tspan fill="#c5a9ed">"reservedSlots"</tspan>: <tspan fill="#d8b56c">0</tspan></text>
      <text x="128" y="452">}</text><text x="104" y="484">]</text>
    </g>
  </g>
  <path d="M814 104v342" stroke="#304248" stroke-width="2"/>
  <rect x="848" y="146" width="278" height="82" rx="12" fill="#172b28" stroke="#59c398" stroke-opacity=".58"/>
  <circle cx="878" cy="187" r="13" fill="#59c398" fill-opacity=".18" stroke="#59c398"/>
  <path d="m872 187 4 4 8-9" fill="none" stroke="#8fd8b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="904" y="183" fill="#d7e2df" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">ALL FIVE PERMISSIONS</text>
  <text x="904" y="207" fill="#8fd8b7" font-family="Segoe UI, sans-serif" font-size="15">must be true</text>
  <rect x="848" y="248" width="278" height="82" rx="12" fill="#2b2417" stroke="#d8b56c" stroke-opacity=".58"/>
  <path d="M878 272v21m0 8v1" stroke="#e6c678" stroke-width="3" stroke-linecap="round"/>
  <circle cx="878" cy="288" r="17" fill="none" stroke="#d8b56c" stroke-opacity=".38"/>
  <text x="904" y="282" fill="#d7e2df" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">PASSWORD</text>
  <text x="904" y="306" fill="#e6c678" font-family="Segoe UI, sans-serif" font-size="15">replace the placeholder</text>
  <text x="848" y="376" fill="#9aabad" font-family="Segoe UI, sans-serif" font-size="14">reservedSlots controls player slots.</text>
  <text x="848" y="400" fill="#9aabad" font-family="Segoe UI, sans-serif" font-size="14">It does not grant Modloader admin access.</text>
  <text x="848" y="460" fill="#71858a" font-family="Segoe UI, sans-serif" font-size="13" letter-spacing="1">EXAMPLE ONLY · DO NOT USE THE PLACEHOLDER</text>
</svg>
