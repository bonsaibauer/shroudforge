<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>__SHROUDFORGE_STYLES__</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="help"><img class="mod-icon" src="__WORLD_EDITOR_ICON__" alt=""><span class="help-text" id="help"></span></div>
    <div id="processProgress" class="process-progress" aria-live="polite">
      <div class="process-caption"><span id="processLabel">World Editor · Ready</span><span id="processElapsed"></span></div>
      <progress id="processBar" max="1" value="0" aria-label="World Editor process progress"></progress>
    </div>
    <div class="mode-badge online"><i></i><span id="blueprintCount">0 BLUEPRINTS</span></div>
    <button id="expandLibrary" class="control expand-button" title="Expand blueprint library" aria-expanded="false">⌄</button>
    <div class="window-controls">
      <button id="minimize" class="window-control" aria-label="Minimize window" title="Minimize">−</button>
      <button class="window-control maximize-disabled" disabled aria-label="Maximize unavailable" title="Fixed panel size">□</button>
      <button id="close" class="window-control window-close" aria-label="Hide window" title="Hide the World Editor">×</button>
    </div>
  </header>
  <div class="cards" id="cards"></div>
  <div class="shortcut-strip" id="shortcutStrip" aria-label="World Editor shortcuts"></div>
  <div class="notice" id="notice"></div>
</div>
<script>
const cards=document.getElementById('cards'),help=document.getElementById('help'),notice=document.getElementById('notice'),keys=document.getElementById('keys'),blueprintCount=document.getElementById('blueprintCount'),expandButton=document.getElementById('expandLibrary');let state={blueprints:[],stage:'idle',hint:'',keybinds:[],windowToggleLabel:'',selected:'',axis:'y',turns:0},noticeTimer,lastStateSignature='',selectedPending='',selectionTimer=null,libraryExpanded=false,recentNames=[];try{recentNames=JSON.parse(localStorage.getItem('worldEditorRecentBlueprints')||'[]').filter(x=>typeof x==='string')}catch{}
function ipc(v,attempt=0){const bridge=window.ipc;if(bridge&&typeof bridge.postMessage==='function'){bridge.postMessage(JSON.stringify(v));return}if(attempt<40&&(v.kind==='ready'||v.kind==='surface'))setTimeout(()=>ipc(v,attempt+1),50)}
let lastReportedSurface='';
function reportVisibleSurface(){
  const visible=element=>{const style=getComputedStyle(element);return element.getClientRects().length>0&&style.visibility!=='hidden'&&Number(style.opacity)!==0};
  const clone=document.body.cloneNode(true),sourceNodes=[...document.body.querySelectorAll('*')],cloneNodes=[...clone.querySelectorAll('*')];
  sourceNodes.forEach((element,index)=>{if(!visible(element))cloneNodes[index]?.remove()});
  const elapsed=clone.querySelector('#processElapsed');if(elapsed)elapsed.textContent='[elapsed timer, per-second updates omitted]';
  const text=(clone.innerText||'').replace(/\r/g,'').split('\n').map(line=>line.trim()).filter(Boolean);
  const controls=[...document.querySelectorAll('button,input,select,textarea,progress,[role="button"],[role="status"]')].filter(visible).map(element=>({
    type:element.tagName.toLowerCase(),text:(element.innerText||element.getAttribute('aria-label')||'').trim(),
    title:element.title||'',disabled:!!element.disabled,expanded:element.getAttribute('aria-expanded'),
    checked:typeof element.checked==='boolean'?element.checked:null,value:element.value||''
  }));
  const labels=[...document.querySelectorAll('[title],[aria-label],img[alt]')].filter(visible).map(element=>({
    text:(element.innerText||'').trim(),title:element.title||'',ariaLabel:element.getAttribute('aria-label')||'',alt:element.getAttribute('alt')||''
  }));
  const surface=JSON.stringify({text,controls,labels});
  if(surface!==lastReportedSurface){lastReportedSurface=surface;ipc({kind:'surface',value:surface})}
}
let surfaceReportTimer=null;
function scheduleSurfaceReport(){clearTimeout(surfaceReportTimer);surfaceReportTimer=setTimeout(reportVisibleSurface,80)}
window.__sfWorldEditorReportSurface=reportVisibleSurface;
window.__worldEditorNotice=(m,level='info')=>{notice.textContent=m;notice.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.classList.remove('show'),3200);ipc({kind:'ui-message',level,message:m});scheduleSurfaceReport()};
const processProgress=document.getElementById('processProgress'),processBar=document.getElementById('processBar'),processLabel=document.getElementById('processLabel'),processElapsed=document.getElementById('processElapsed');
let processSequence=null,processStarted=0;
function renderProcessProgress(s){
  const status=s.processState||'idle',completed=Math.max(0,Number(s.processCompleted)||0),total=Math.max(0,Number(s.processTotal)||0);
  processProgress.hidden=false;
  processProgress.dataset.status=status;
  if(s.processSequence!==processSequence){processSequence=s.processSequence;processStarted=performance.now()}
  processBar.max=Math.max(1,total);
  if(total>0)processBar.value=Math.min(total,completed);else processBar.removeAttribute('value');
  processLabel.textContent=[s.processOperation,s.processPhase].filter(Boolean).join(' · ')||'World Editor · Ready';
  const detail=total>0?`${completed}/${total} steps complete`:'Working';
  processProgress.title=status==='error'?`${detail}. ${s.hint||s.processPhase}`:detail;
  processBar.setAttribute('aria-valuetext',`${processLabel.textContent}. ${detail}`);
  processElapsed.textContent=status==='running'?`${total>0?`${completed}/${total} · `:''}${Math.floor((performance.now()-processStarted)/1000)}s`:status==='complete'?'✓':status==='idle'?'':`${completed}/${total||'—'}`;
}
setInterval(()=>{if(state.processState==='running')renderProcessProgress(state)},1000);
function keybindLabel(s,id){return(s.keybinds||[]).find(binding=>binding.id===id)?.key||''}
function renderShortcuts(s){const strip=document.getElementById('shortcutStrip');strip.replaceChildren();for(const binding of s.keybinds||[]){const item=document.createElement('span'),key=document.createElement('kbd');key.textContent=binding.key;item.append(key,document.createTextNode(' '+binding.label));strip.append(item)}if(s.windowToggleLabel){const item=document.createElement('span'),key=document.createElement('kbd');key.textContent=s.windowToggleLabel;item.append(key,document.createTextNode(' Show / hide'));strip.append(item)}document.getElementById('close').title=s.windowToggleLabel?`Hide the World Editor. Press ${s.windowToggleLabel} to reopen`:'Hide the World Editor'}
function guide(s){if(s.hint)return s.hint;switch(s.stage){case'need_b':return`Corner A is marked. Aim at the opposite corner and press ${keybindLabel(s,'markCursorNext')} again.`;case'ready':return`The selection is ready. Press ${keybindLabel(s,'captureAndSave')} to capture and save the blueprint.`;case'capturing':return'Capturing props and voxels, creating the blueprint file, and adding it to the library…';case'selected':return`“${s.selected}” is selected. Aim where you want to place it, then press ${keybindLabel(s,'pasteAtCursor')} to place it.`;case'placing':return`Placing “${s.selected}” at the aimed target…`;case'recovery':return`Placement is incomplete. Press ${keybindLabel(s,'undoVoxels')} to retry recovery.`;default:return`Select the Building Hammer, choose a Single Voxel, aim at the first corner, then press ${keybindLabel(s,'markCursorNext')}.`}}
function updateHelp(s){const full=guide(s),paste=keybindLabel(s,'pasteAtCursor');let visible=full;if(full.includes('No new placement started')&&full.includes(`${paste} was not sent`))visible=`${paste} paused: Undo is still active. Wait for the undo result. No placement was started.`;else if(full.includes('temporarily unavailable')&&full.includes('Undo is paused'))visible='Runtime unavailable. Undo is paused. No input was sent.';help.textContent=visible;help.title=full}
function blueprintSignature(s){return(s.blueprints||[]).map(b=>`${b.name}\u0000${b.image?`${b.image.length}:${b.image.slice(0,48)}`:''}`).join('\u0001')}
function action(name,value=''){ipc({kind:'action',action:name,value})}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(x){return escapeHtml(x)}
function rememberBlueprint(name){if(!name)return;recentNames=[name,...recentNames.filter(x=>x!==name)];try{localStorage.setItem('worldEditorRecentBlueprints',JSON.stringify(recentNames))}catch{}}
function setLibraryExpanded(value){libraryExpanded=!!value;cards.classList.toggle('expanded',libraryExpanded);expandButton.textContent=libraryExpanded?'⌃':'⌄';expandButton.title=libraryExpanded?'Collapse blueprint library':'Expand blueprint library';expandButton.setAttribute('aria-expanded',String(libraryExpanded));const columns=Math.max(1,getComputedStyle(cards).gridTemplateColumns.split(' ').length);const rows=Math.min(6,Math.max(1,Math.ceil((state.blueprints.length+1)/columns)));const height=Math.min(720,Math.max(190,61+rows*109));ipc({kind:'library-expand',expanded:libraryExpanded,height})}
function requestBlueprint(name){if(state.selected===name&&!selectedPending){rememberBlueprint(name);setLibraryExpanded(false);return}selectedPending=name;rememberBlueprint(name);renderCards(state);help.textContent=`Loading “${name}”…`;window.__worldEditorNotice(`Loading “${name}”…`);action('selectBlueprint',name);clearTimeout(selectionTimer);selectionTimer=setTimeout(()=>{if(selectedPending===name){selectedPending='';renderCards(state);help.textContent=guide(state);window.__worldEditorNotice(`Could not confirm “${name}” as the active blueprint after 5 seconds.`, 'warn')}},5000);setLibraryExpanded(false);scheduleSurfaceReport()}
function selectNewBlueprint(){selectedPending='';clearTimeout(selectionTimer);state={...state,selected:'',stage:'need_a',hint:`New blueprint selected. Aim at the first corner and press ${keybindLabel(state,'markCursorNext')} to mark it.`};renderCards(state);help.textContent=guide(state);setLibraryExpanded(false);action('newBlueprint')}
function renderCards(s){
  cards.replaceChildren();
  const newActive=!s.selected&&!selectedPending;
  const add=document.createElement('button');
  add.type='button';
  add.className='card create'+(newActive?' active':'');
  const addStatus=newActive?(s.stage==='need_b'?'CORNER B NEXT':s.stage==='ready'?`PRESS ${keybindLabel(s,'captureAndSave')}`:s.stage==='capturing'?'SAVING…':'ACTIVE'):'CREATE';
  add.innerHTML=`<span class="create-art" aria-hidden="true"><svg class="new-blueprint-icon" viewBox="0 0 44 54"><path class="page" d="M5 2h24l10 10v38H5zM29 2v10h10"/><path class="plus" d="M16 31h12M22 25v12"/></svg></span><span class="create-label">New blueprint</span><span class="card-state">${escapeHtml(addStatus)}</span>`;
  add.title=`Start a new capture. ${keybindLabel(s,'markCursorNext')} marks the first corner.`;
  add.setAttribute('aria-pressed',String(newActive));
  add.onclick=selectNewBlueprint;
  cards.append(add);

  const activeName=selectedPending||s.selected;
  const ordered=[...s.blueprints].sort((a,b)=>{
    if(a.name===activeName)return -1;
    if(b.name===activeName)return 1;
    const ai=recentNames.indexOf(a.name),bi=recentNames.indexOf(b.name);
    if(ai>=0||bi>=0)return(ai<0?Infinity:ai)-(bi<0?Infinity:bi);
    return a.name.localeCompare(b.name,undefined,{sensitivity:'base'});
  });
  for(const blueprint of ordered){
    const isActive=blueprint.name===activeName;
    const card=document.createElement('article');
    card.className='card blueprint-card'+(isActive?' active':'')+(selectedPending===blueprint.name?' pending':'');
    card.title='Click to select this schematic';
    card.tabIndex=0;
    card.setAttribute('aria-pressed',String(isActive));
    const thumb=document.createElement('div');
    thumb.className='thumb';
    if(blueprint.image){
      const image=document.createElement('img');
      image.src=blueprint.image;
      image.alt='Screenshot of '+blueprint.name;
      thumb.append(image);
    }else{
      const placeholder=document.createElement('div');
      placeholder.className='placeholder';
      placeholder.innerHTML='<span class="blueprint-icon" aria-hidden="true"></span><span class="placeholder-label">BLUEPRINT</span>';
      thumb.append(placeholder);
    }
    const label=document.createElement('div');
    label.className='name';
    label.textContent=blueprint.name;
    const badge=document.createElement('span');
    badge.className='card-state';
    badge.textContent=selectedPending===blueprint.name?'LOADING…':isActive?'ACTIVE':'';
    card.append(thumb,label,badge);
    card.onclick=()=>requestBlueprint(blueprint.name);
    card.onkeydown=event=>{
      if(event.key==='Enter'||event.key===' '){event.preventDefault();requestBlueprint(blueprint.name)}
    };
    cards.append(card);
  }
}
let lastCardsSignature='';window.__worldEditorUpdate=s=>{const signature=JSON.stringify([s.stage,s.hint,s.selected,s.processState,s.processOperation,s.processPhase,s.processCompleted,s.processTotal,s.processSequence,s.keybinds,s.windowToggleLabel,blueprintSignature(s)]);if(signature===lastStateSignature){scheduleSurfaceReport();return}lastStateSignature=signature;const previousSelected=state.selected;state=s;renderProcessProgress(s);renderShortcuts(s);if(s.selected&&s.selected!==previousSelected)rememberBlueprint(s.selected);if(selectedPending&&s.selected===selectedPending){clearTimeout(selectionTimer);selectedPending='';rememberBlueprint(s.selected)}if(['need_a','need_b','ready','capturing'].includes(s.stage)){selectedPending='';clearTimeout(selectionTimer)}blueprintCount.textContent=`${s.blueprints.length} BLUEPRINT${s.blueprints.length===1?'':'S'}`;document.body.classList.toggle('capturing',s.stage==='capturing');updateHelp(s);const cardsSignature=JSON.stringify([s.stage,s.selected,selectedPending,s.keybinds,blueprintSignature(s)]);if(cardsSignature!==lastCardsSignature){lastCardsSignature=cardsSignature;renderCards(s)}scheduleSurfaceReport()};
window.addEventListener('shroudforge-world-editor-state',event=>window.__worldEditorUpdate(event.detail));if(window.__sfPendingState)window.__worldEditorUpdate(window.__sfPendingState);expandButton.onclick=()=>setLibraryExpanded(!libraryExpanded);document.getElementById('close').onclick=()=>ipc({kind:'hide'});document.getElementById('minimize').onclick=()=>ipc({kind:'minimize'});document.addEventListener('input',scheduleSurfaceReport,true);document.addEventListener('change',scheduleSurfaceReport,true);document.addEventListener('wheel',e=>{const library=e.target.closest('.cards');if(library&&libraryExpanded&&library.scrollHeight>library.clientHeight){library.scrollTop+=e.deltaY||e.deltaX;e.preventDefault()}},{passive:false});window.addEventListener('resize',()=>{if(libraryExpanded)setLibraryExpanded(true)});window.addEventListener('error',e=>ipc({kind:'script-error',value:String(e.message||'unknown UI script error')}));window.addEventListener('unhandledrejection',e=>ipc({kind:'script-error',value:String(e.reason||'unhandled promise rejection')}));new MutationObserver(scheduleSurfaceReport).observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['aria-expanded','aria-label','class','disabled','hidden','title','value','checked']});ipc({kind:'ready'});scheduleSurfaceReport();
</script>
</body>
</html>
