[package]
name = "shroudforge-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "../entrypoints/build_windows_app_icon.rs"
[[bin]]
name = "shroudforge-updater"
path = "bin.rs"

[lib]
path = "lib.rs"

[dependencies]
shroudforge-loader-config.workspace = true
shroudforge-logging.workspace = true
shroudforge-game-assets.workspace = true
shroudforge-news.workspace = true
fs2 = "0.4"
parking_lot = "0.12"
serde.workspace = true
serde_json.workspace = true
shroudforge-package.workspace = true
shroudforge-window-management.workspace = true
shroudforge-release-feed.workspace = true
shroudforge-ui-resources.workspace = true
mod-loader-bridge = { path = "../../kfc-parser/crates/mod-loader-bridge" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
sha2 = "0.10"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[build-dependencies]
winres.workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_RestartManager",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
tao = "0.37.0"
wry = "0.57.0"
