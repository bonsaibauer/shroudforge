[package]
name = "shroudforge-modloader-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobins = false

[lib]
path = "lib.rs"

[dependencies]
shroudforge-hotkeys.workspace = true
shroudforge-loader-config.workspace = true
shroudforge-logging.workspace = true
shroudforge-news.workspace = true
shroudforge-game-assets.workspace = true
shroudforge-ui-resources.workspace = true
shroudforge-release-feed.workspace = true
shroudforge-player-name.workspace = true
shroudforge-runtime-diagnostics = { path = "../../runtime-diagnostics" }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
base64 = "0.22"
shroudforge-package.workspace = true
shroudforge-window-management.workspace = true

[target.'cfg(windows)'.dependencies]
tao = "0.37.0"
wry = "0.57.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
