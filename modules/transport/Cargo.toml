[package]
name = "shroudforge-steam-networking"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "lib.rs"

[dependencies]
base64 = "0.22"
tracing = "0.1"
shroudforge-loader-config.workspace = true
shroudforge-hotkeys.workspace = true
shroudforge-news.workspace = true
shroudforge-logging.workspace = true
shroudforge-player-name.workspace = true
mod-loader = { package = "shroudforge-package", path = "../modloader" }
mlua = { version = "0.11.2", features = ["lua54", "error-send", "vendored"] }
serde_json = "1.0"
semver.workspace = true
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }
