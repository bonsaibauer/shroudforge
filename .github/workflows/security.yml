name: Security scans

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Scan source and dependencies with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: .git,target,build,x64
          format: sarif
          output: trivy-results.sarif
          # Findings are reported to Code Scanning; they do not block this workflow.
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Code Scanning
        if: >-
          always() && hashFiles('trivy-results.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem

      - name: Summarize Trivy findings
        if: always()
        shell: bash
        run: |
          if [[ -f trivy-results.sarif ]]; then
            total=$(jq '[.runs[].results[]?] | length' trivy-results.sarif)
            errors=$(jq '[.runs[].results[]? | select((.level // "" | ascii_downcase) == "error")] | length' trivy-results.sarif)
            warnings=$(jq '[.runs[].results[]? | select((.level // "" | ascii_downcase) == "warning")] | length' trivy-results.sarif)
            notes=$(jq '[.runs[].results[]? | select((.level // "" | ascii_downcase) == "note")] | length' trivy-results.sarif)
          else
            total=0
            errors=0
            warnings=0
            notes=0
          fi

          {
            echo "## Trivy filesystem scan"
            echo
            echo "| Total findings | Errors | Warnings | Notes |"
            echo "|---:|---:|---:|---:|"
            echo "| ${total} | ${errors} | ${warnings} | ${notes} |"
            echo
            echo "Trivy findings do not block this workflow. SARIF is uploaded to Code Scanning when the event token permits it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Trivy SARIF report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif-${{ github.run_number }}
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 14
