name: ShroudForge Release Build

on:
  workflow_dispatch:
    inputs:
      required_release:
        description: Required release
        type: boolean
        required: false

permissions:
  contents: read

concurrency:
  group: shroudforge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Scan source and dependencies with Trivy
        id: trivy_source
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: .git,target,build,x64
          trivyignores: dev/build/source-trivy-ignore.yaml
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Code Scanning
        id: upload_source_sarif
        if: >-
          always() && hashFiles('trivy-results.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem

      - name: Prepare Trivy filesystem report
        if: always()
        shell: bash
        env:
          TRIVY_SCAN_OUTCOME: ${{ steps.trivy_source.outcome }}
          TRIVY_SARIF_UPLOAD_OUTCOME: ${{ steps.upload_source_sarif.outcome }}
        run: |
          python3 dev/build/write_release_security_report.py trivy \
            --target "Source code and dependencies" \
            --sarif trivy-results.sarif \
            --scan-outcome "$TRIVY_SCAN_OUTCOME" \
            --sarif-upload-outcome "$TRIVY_SARIF_UPLOAD_OUTCOME" \
            --output trivy-filesystem.json

      - name: Save Trivy filesystem report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-filesystem-report-${{ github.run_id }}
          path: |
            trivy-filesystem.json
            trivy-results.sarif
          if-no-files-found: warn
          retention-days: 1

  release-check:
    name: Check whether this event builds a release
    runs-on: ubuntu-24.04
    outputs:
      build_release: ${{ steps.check.outputs.build_release }}
    steps:
      - name: Check event and branch name
        id: check
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "build_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    if: needs.release-check.outputs.build_release == 'true'
    needs: release-check
    permissions:
      contents: read
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set version from branch
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "The selected branch must be a version such as 1.0.0. Current branch: $version"
          }
          Set-Content -LiteralPath VERSION -Value $version -Encoding ascii
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build, test and package
        shell: pwsh
        run: .\dev\build\release_build.ps1 -BuildNumber "${{ github.run_id }}"

      - name: Upload release packages for malware scan
        uses: actions/upload-artifact@v7
        with:
          name: shroudforge-release-${{ github.run_id }}
          path: |
            build/shroudforge-*.zip
            build/shroudforge-*.zip.sha256
          if-no-files-found: error

  defender:
    name: Microsoft Defender release scan
    needs: build
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out Defender scan script
        uses: actions/checkout@v7

      - name: Download release packages
        uses: actions/download-artifact@v7
        with:
          name: shroudforge-release-${{ github.run_id }}
          path: build

      - name: Scan release packages with Microsoft Defender
        id: defender_scan
        continue-on-error: true
        shell: pwsh
        run: .\dev\build\scan_release_with_defender.ps1 -ArchiveDirectory build -ReportPath defender-release-report.json

      - name: Save Microsoft Defender report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: defender-release-report-${{ github.run_id }}
          path: defender-release-report.json
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce Microsoft Defender scan result
        if: always()
        shell: pwsh
        env:
          DEFENDER_SCAN_OUTCOME: ${{ steps.defender_scan.outcome }}
        run: |
          if (-not (Test-Path -LiteralPath 'defender-release-report.json')) {
            throw "Microsoft Defender did not produce a scan report. Scan step: $env:DEFENDER_SCAN_OUTCOME"
          }
          $report = Get-Content -LiteralPath 'defender-release-report.json' -Raw | ConvertFrom-Json
          if ($env:DEFENDER_SCAN_OUTCOME -ne 'success' -or $report.status -ne 'clean') {
            throw "Microsoft Defender result is '$($report.status)'. See the unified release security report for details."
          }

  virustotal:
    name: VirusTotal release scan
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out VirusTotal scanner
        uses: actions/checkout@v7

      - name: Download release packages
        uses: actions/download-artifact@v7
        with:
          name: shroudforge-release-${{ github.run_id }}
          path: build

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq

      - name: Scan release ZIPs with the VirusTotal API
        id: virustotal_scan
        continue-on-error: true
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: bash dev/build/scan_release_with_virustotal.sh --archive-directory build --report-path virustotal-release.json

      - name: Save VirusTotal report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: virustotal-release-report-${{ github.run_id }}
          path: virustotal-release.json
          if-no-files-found: warn
          retention-days: 1

      - name: Enforce VirusTotal release scan result
        if: always()
        shell: pwsh
        env:
          VIRUSTOTAL_SCAN_OUTCOME: ${{ steps.virustotal_scan.outcome }}
        run: |
          if (-not (Test-Path -LiteralPath 'virustotal-release.json')) {
            throw "VirusTotal did not produce a scan report. Scan step: $env:VIRUSTOTAL_SCAN_OUTCOME"
          }
          $report = Get-Content -LiteralPath 'virustotal-release.json' -Raw | ConvertFrom-Json
          $maliciousCount = [int]$report.malicious_count
          if ($env:VIRUSTOTAL_SCAN_OUTCOME -ne 'success' -or $report.status -notin @('clean', 'warning', 'findings') -or $maliciousCount -ge 2) {
            throw "VirusTotal result is '$($report.status)' with $($report.malicious_count) malicious detection(s). See the unified release security report for details."
          }

  clamav:
    name: Scan built release with Trivy and ClamAV
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download release packages
        uses: actions/download-artifact@v7
        with:
          name: shroudforge-release-${{ github.run_id }}
          path: build

      - name: Expand release packages for scanning
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends unzip
          shopt -s nullglob
          archives=(build/*.zip)
          if (( ${#archives[@]} == 0 )); then
            echo "No release ZIPs were downloaded." >&2
            exit 1
          fi

          mkdir -p scanned-release
          for archive in "${archives[@]}"; do
            destination="scanned-release/$(basename "${archive%.zip}")"
            mkdir -p "$destination"
            unzip -q "$archive" -d "$destination"
          done

      - name: Scan built release packages with Trivy
        id: trivy_release
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: scanned-release
          scanners: vuln,secret,misconfig
          vuln-type: os,library
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-release.sarif
          # Findings are reported to Code Scanning; malware scans below gate publishing.
          exit-code: "0"

      - name: Upload release Trivy SARIF to GitHub Code Scanning
        id: upload_release_sarif
        if: always() && hashFiles('trivy-release.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-release.sarif
          category: trivy-release

      - name: Install ClamAV and update signatures
        id: clamav_signatures
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          sudo freshclam 2>&1 | tee freshclam.log

      - name: Scan packaged release files for malware
        id: clamav_scan
        run: |
          set +e
          clamscan --recursive --infected build scanned-release 2>&1 | tee clamav-output.log
          scan_status=${PIPESTATUS[0]}
          set -e
          exit "$scan_status"

      - name: Prepare release scanner reports
        if: always()
        shell: bash
        env:
          TRIVY_SCAN_OUTCOME: ${{ steps.trivy_release.outcome }}
          TRIVY_SARIF_UPLOAD_OUTCOME: ${{ steps.upload_release_sarif.outcome }}
          CLAMAV_SIGNATURE_UPDATE_OUTCOME: ${{ steps.clamav_signatures.outcome }}
          CLAMAV_SCAN_OUTCOME: ${{ steps.clamav_scan.outcome }}
        run: |
          python3 dev/build/write_release_security_report.py trivy \
            --target "Release package" \
            --sarif trivy-release.sarif \
            --scan-outcome "$TRIVY_SCAN_OUTCOME" \
            --sarif-upload-outcome "$TRIVY_SARIF_UPLOAD_OUTCOME" \
            --output trivy-release.json

          clamav_version="$(clamscan --version 2>/dev/null || true)"
          python3 dev/build/write_release_security_report.py clamav \
            --scan-outcome "$CLAMAV_SCAN_OUTCOME" \
            --signature-update-outcome "$CLAMAV_SIGNATURE_UPDATE_OUTCOME" \
            --version "$clamav_version" \
            --log clamav-output.log \
            --output clamav-release.json

      - name: Save release scanner reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-scanner-reports-${{ github.run_id }}
          path: |
            trivy-release.json
            trivy-release.sarif
            clamav-release.json
            clamav-output.log
            freshclam.log
          if-no-files-found: warn
          retention-days: 1

  security-report:
    name: Unified release security report
    if: always()
    needs: [build, security, defender, clamav, virustotal]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out report generator
        uses: actions/checkout@v7

      - name: Prepare report folders
        run: mkdir -p security-reports/trivy-filesystem security-reports/defender security-reports/release security-reports/virustotal

      - name: Download Trivy filesystem report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: trivy-filesystem-report-${{ github.run_id }}
          path: security-reports/trivy-filesystem

      - name: Download Defender report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: defender-release-report-${{ github.run_id }}
          path: security-reports/defender

      - name: Download release scanner reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: release-scanner-reports-${{ github.run_id }}
          path: security-reports/release

      - name: Download VirusTotal report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: virustotal-release-report-${{ github.run_id }}
          path: security-reports/virustotal

      - name: Write unified release security report
        if: always()
        env:
          BUILD_JOB_RESULT: ${{ needs.build.result }}
          TRIVY_SOURCE_JOB_RESULT: ${{ needs.security.result }}
          DEFENDER_JOB_RESULT: ${{ needs.defender.result }}
          RELEASE_SCAN_JOB_RESULT: ${{ needs.clamav.result }}
          VIRUSTOTAL_JOB_RESULT: ${{ needs.virustotal.result }}
          RELEASE_VERSION: ${{ needs.build.outputs.version || 'unknown' }}
        run: python3 dev/build/write_release_security_report.py aggregate --reports-dir security-reports --output-dir security-reports/unified

      - name: Package security reports for the release
        if: always()
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version || 'unknown' }}
          RUN_ID: ${{ github.run_id }}
          REQUIRED_RELEASE: ${{ inputs.required_release }}
        run: |
          required_release=()
          if [[ "$REQUIRED_RELEASE" == 'true' ]]; then
            required_release+=(--required-release)
          fi
          python3 dev/build/package_release_security_report.py \
            --reports-directory security-reports \
            --archive-path "release-assets/security-report-${RELEASE_VERSION}-${RUN_ID}.zip" \
            "${required_release[@]}"

      - name: Save release security report bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shroudforge-security-report-${{ github.run_id }}
          path: |
            release-assets/*.zip
            release-assets/*.zip.sha256
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish scanned release packages
    needs: [build, defender, clamav, virustotal, security, security-report]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download scanned release packages
        uses: actions/download-artifact@v7
        with:
          name: shroudforge-release-${{ github.run_id }}
          path: build

      - name: Download release security report bundle
        uses: actions/download-artifact@v7
        with:
          name: shroudforge-security-report-${{ github.run_id }}
          path: release-security-report

      - name: Verify and extract release security report
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RUN_ID: ${{ github.run_id }}
        run: |
          archive="release-security-report/security-report-${RELEASE_VERSION}-${RUN_ID}.zip"
          sidecar="$(basename -- "$archive").sha256"
          (cd release-security-report && sha256sum --check "$sidecar")
          python3 -m zipfile -e "$archive" release-security-report/unpacked
          test -s release-security-report/unpacked/release-body.md

      - name: Prepare release changelog
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          REQUIRED_RELEASE: ${{ inputs.required_release }}
        run: |
          changelog="changelog/${RELEASE_VERSION}.md"
          test -s "$changelog"
          if [[ "$REQUIRED_RELEASE" == 'true' ]]; then
            {
              printf 'ShroudForge-Update: required\n\n'
              cat "$changelog"
            } > release-notes.md
          else
            cp "$changelog" release-notes.md
          fi

      - name: Publish release build
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}-build.${{ github.run_id }}
          name: ShroudForge v${{ needs.build.outputs.version }} build ${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          files: |
            build/shroudforge-*.zip
            build/shroudforge-*.zip.sha256
            release-security-report/*.zip
            release-security-report/*.zip.sha256
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: false
          make_latest: true
