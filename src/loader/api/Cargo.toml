[package]
name = "shroudforge-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
shroudforge-runtime-diagnostics = { path = "../modules/runtime-diagnostics" }
shroudforge-parser = { path = "../../parser" }
shroudforge-compatibility = { path = "../compatibility" }
kfc = { git = "https://github.com/bonsaibauer/kfc-parser.git", rev = "933c11a68854894dd75414812f275543c4ee2faa", features = ["resource", "content"] }
mod-loader = { package = "shroudforge-package", path = "../package" }

thiserror = "2.0"
walkdir = "2.5"
anyhow = { version = "1.0", features = ["backtrace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.9", features = ["serde"] }
parking_lot = "0.12"
uuid = { version = "1.18", features = ["v4"] }
crc = "3.3"
sha2 = "0.10"
camino = "1.1"
bitflags = { version = "2.8", features = ["serde"] }
half = "2.6"
image = "0.25"
tracing = "0.1"
mlua = { version = "0.11.2", features = ["lua54", "error-send", "vendored"] }
once_cell = "1.21.3"
ouroboros = "0.18.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
