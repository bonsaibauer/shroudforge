die aktuelle Liste von GitHub …`,"news.contributors.unavailable":`Die Liste ist gerade nicht erreichbar. Auf GitHub findest du sie trotzdem.`,"news.contributors.commits":`{count} Commits`,"news.contributors.all":`Alle Beiträge auf GitHub ansehen ↗`,"news.notice.welcome.message":`ShroudForge baut auf der Arbeit auf, die in der Enshrouded-Modding-Community schon geleistet wurde. Brabb3l hat mit dem kfc-parser und EML wichtige Grundlagen geschaffen. Shroudtopia hat Runtime-Mods möglich gemacht, die sich während des Spielens laden, entladen und einstellen lassen. Danke an alle, die Werkzeuge, Beispiele, Wissen und Zeit mit der Community teilen.

ShroudForge verbindet Mod-Verwaltung, Runtime-Funktionen und Asset-Vorbereitung an einem Ort. Auch dokumentierte Mods aus dem EML-Umfeld sollen weiter nutzbar bleiben. Die Links unter dieser Nachricht führen dich zum Einstiegsguide, zu EML, zum kfc-parser und zu Shroudtopia. Darunter findest du außerdem die Beitragenden, die an ShroudForge mitgearbeitet haben. 💚`,"news.notice.modsGuide.title":`Was die mitgelieferten Mods tun 🧩`,"news.notice.modsGuide.message":`Hey {username}, hier findest du einen Überblick über die Mods, die ShroudForge mitbringt. Sie sind nicht alle automatisch aktiviert. Öffne links Installierte Mods, um eine Mod auszuwählen, ihre Beschreibung zu lesen, Einstellungen anzupassen und Voraussetzungen oder Änderungsnotizen anzusehen.

SPIELABLAUF UND INVENTAR
• Auto Stamina Refill füllt deine Ausdauer fortlaufend bis zum Maximum auf.
• Unlimited Flight hebt das Zeitlimit beim Fliegen auf. Die Mod benötigt Auto Stamina Refill. Halte also beide verfügbar und aktiviert.
• Infinite Item Split erhält den ursprünglichen Stapel beim Aufteilen und beeinflusst auch weitere Inventaraktionen.
• Infinite Item Use verhindert, dass unterstützte Gegenstände beim Benutzen verbraucht werden.
• No Fall Damage verhindert Gesundheitsschaden durch Stürze.
• No Resource Cost entfernt bei unterstützten Bau-, Herstellungs- und Benutzaktionen den Ressourcenverbrauch.

HERSTELLUNG UND BAUPLÄNE
• Production Time lässt dich die Basisdauer zeitgesteuerter Produktion einstellen. Der Weltgeschwindigkeitsfaktor gilt weiterhin. Asset-Änderungen müssen vor dem Spielstart vorbereitet werden.
• Unlock Blueprints ändert bei unterstützten Rezepten die Freischaltbedingung auf den ersten Hinweis des Flammenaltars.

WELTENBAU
• World Editor kann Weltbereiche aufnehmen, speichern, drehen und platzieren. Die Anleitung erklärt Einrichtung und Steuerung.

Eine Mod wirkt nur, wenn sie aktiviert ist und die jeweilige Spielsituation unterstützt. Manche Änderungen an Spieldaten müssen vor dem nächsten Spielstart vorbereitet werden. Über den Button unter dieser Nachricht kannst du die installierten Mods ansehen.`,"news.notice.configuration.title":`Lust auf deine erste Mod, {username}? 🛠️`,"news.notice.configuration.message":`Jede Mod beginnt mit mod.json: Name, Version, Autor:innen, Abhängigkeiten und die Funktionen, die sie braucht. ShroudForge-spezifische Schalter, Einstellungen, Buttons und Links stehen in der optionalen extended.mod.json. Der Modloader kann diese Einstellungen für Spieler:innen anzeigen, und dein Lua-Code kann sie über die ShroudForge-API auslesen. Du musst nicht gleich jedes Feld kennen. Starte mit der funktionierenden Hello-Ember-Vorlage und lies in der extended.mod.json-Anleitung nach, wie Einstellungen definiert und im Modloader angezeigt werden.`,"news.notice.discord.title":`Frage, Idee oder neugierig, {username}? 💬`,"news.notice.discord.message":`Du hast eine Frage, eine Idee oder möchtest einfach hören, woran andere gerade tüfteln? Im Enshrouded-Modding-Discord treffen sich Spieler:innen und Mod-Schaffende zum Austauschen und Helfen. Du kannst auch erst einmal nur mitlesen – beitreten ist natürlich freiwillig.`,"news.notice.discord.join":`Discord beitreten`,"news.notice.applySettings.title":`Alles gespeichert, {username} 🔧`,"news.notice.applySettings.message":`Deine Auswahl wird gespeichert, sobald du sie übernimmst. Was danach passiert, hängt von der Mod ab: Runtime-Mods können neue Einstellungen direkt verwenden, wenn ihr Code den aktuellen Wert in einem passenden Callback abfragt. Änderungen an Spieldateien werden vor dem nächsten Start vorbereitet – schließe Enshrouded dafür zuerst. Zeigt der Modloader einen Neustart-Hinweis, wartet deine Änderung einfach auf die nächste Spielsitzung.`,"news.notice.feedback.title":`Ist dir etwas aufgefallen, {username}? 🐛`,"news.notice.feedback.message":`Ein Fehler, eine verwirrende Meldung oder etwas, das sich unnötig umständlich anfühlt? Gib gern Bescheid. Auch kleine Hinweise helfen dabei, ShroudForge verständlicher und zuverlässiger zu machen.

Besonders hilfreich sind die Versionen von Enshrouded und ShroudForge, deine aktiven Mods, was du erwartet hast und was stattdessen passiert ist. Wenn du die Schritte zum Nachstellen dazuschreibst, lässt sich dem Problem viel leichter folgen. Ein kurzer Log-Auszug kann ebenfalls helfen.

Bitte entferne persönliche Daten, bevor du Logs teilst. Wenn das Problem nur mit einer bestimmten Mod auftritt, melde es am besten auch der Person, die diese Mod erstellt hat. Die Links unter dieser Nachricht öffnen das Fehlerformular und erklären, wie ShroudForge-Mod-Logs funktionieren.`,"news.notice.support.title":`ShroudForge gefällt dir? ☕`,"news.notice.support.message":`Hey {username}, schön, dass du ShroudForge ausprobierst! Wenn dir das Projekt gefällt und du meine Arbeit daran unterstützen möchtest, kannst du mir einen Kaffee spendieren. Der Beitrag geht direkt an mich und unterstützt meine Arbeit an ShroudForge.

Das ist natürlich freiwillig und mit keinerlei Erwartung verbunden. Auch wenn du den Loader ausprobierst, Feedback gibst oder einen Fehler meldest, hilfst du dem Projekt schon sehr. Danke dir! 💚`,"news.link.guide":`Zum Einstiegsguide`,"news.link.eml":`EML-Anleitung von Brabb3l`,"news.link.kfc":`kfc-parser auf GitHub`,"news.link.shroudtopia":`Shroudtopia auf GitHub`,"news.link.firstMod":`Erste Mod bauen`,"news.link.settings":`Mod-Einstellungen verstehen`,"news.link.extendedModJson":`extended.mod.json-Anleitung lesen`,"news.link.api":`API-Referenz öffnen`,"news.link.playerGuide":`Änderungen im Guide nachlesen`,"news.link.modsGuide":`Mitgelieferte Mods ansehen`,"news.action.open-installed-mods":`Installierte Mods ansehen`,"news.link.reportIssue":`Fehler melden`,"news.link.loggingGuide":`So funktionieren ShroudForge-Mod-Logs`,"news.link.buyCoffee":`Kaffee spendieren`,"news.log.warning.title":`Ein Hinweis aus dem Log braucht kurz deine Aufmerksamkeit`,"news.log.warning.message":`{source} hat diese Warnung {count}× gemeldet: {excerpt}. Öffne das Debug-Log, wenn du den vollständigen Eintrag und den Kontext dazu sehen möchtest.`,"news.log.error.title":`Hier ist etwas fehlgeschlagen`,"news.log.error.message":`{source} hat denselben Fehler {count}× gemeldet: {excerpt}. Im Debug-Log findest du den vollständigen Eintrag. Wenn eine Mod betroffen ist, öffne auch ihre Mod-Seite für den aktuellen Status.`,"news.modStatus.failed.title":`{name} konnte nicht erfolgreich starten`,"news.modStatus.failed.message":`Der Loader konnte diese Mod nicht wie vorgesehen ausführen. Gemeldeter Grund: {detail}. Öffne die Mod-Seite, um den Status zu prüfen. Dort siehst du, ob eine Abhängigkeit, Berechtigung oder Spielversion im Weg steht.`,"news.modStatus.blocked.title":`{name} wartet auf eine Voraussetzung`,"news.modStatus.blocked.message":`Die Mod wurde übersprungen, weil eine benötigte Abhängigkeit oder passende Version nicht verfügbar ist: {detail}. Öffne die Mod-Seite und prüfe, welche Mod noch rs.title":`Thanks for building this with us`,"news.contributors.description":`These are the accounts whose commits GitHub attributes to this project. Ideas, testing, and help from the community make ShroudForge better too.`,"news.contributors.loading":`Loading the latest list from GitHub …`,"news.contributors.unavailable":`The list is unavailable right now. You can still view it on GitHub.`,"news.contributors.commits":`{count} commits`,"news.contributors.all":`View all contributions on GitHub ↗`,"news.notice.welcome.message":`ShroudForge builds on work already done by the Enshrouded modding community. Brabb3l laid important foundations with kfc-parser and EML. Shroudtopia made runtime mods possible, including loading, unloading, and configuring them while the game is running. Thank you to everyone who shares tools, examples, knowledge, and time with the community.

ShroudForge brings mod management, runtime features, and asset preparation together in one place. Documented mods from the EML ecosystem should remain usable too. The links below take you to the getting started guide, EML, kfc-parser, and Shroudtopia. The contributor list underneath shows people whose work on GitHub is connected to ShroudForge. 💚`,"news.notice.modsGuide.title":`What the included mods do 🧩`,"news.notice.modsGuide.message":`Hey {username}, here is an overview of the mods included with ShroudForge. They are not all enabled automatically. Open Installed Mods on the left to choose a mod, read its description, adjust settings, and check requirements or update notes.

GAMEPLAY AND INVENTORY
• Auto Stamina Refill keeps restoring stamina up to its maximum.
• Unlimited Flight removes the flight time limit. It requires Auto Stamina Refill, so keep both available and enabled.
• Infinite Item Split keeps the original stack when splitting items and also affects other inventory actions.
• Infinite Item Use prevents supported items from being consumed when used.
• No Fall Damage prevents health loss from falling.
• No Resource Cost removes resource use in supported building, crafting, and item-use actions.

CRAFTING AND BLUEPRINTS
• Production Time lets you choose the base duration for timed production. World speed settings still apply. Prepare asset changes before launching the game.
• Unlock Blueprints changes supported recipe unlock requirements to the first Flame Altar hint.

WORLD BUILDING
• World Editor lets you capture, save, rotate, and place parts of a world. Its guide explains setup and controls.

A mod only has an effect when it is enabled and supported for that situation. Some asset changes need preparation before the next game start. Use the button below to view your installed mods.`,"news.notice.configuration.title":`Ready to make your first mod, {username}? 🛠️`,"news.notice.configuration.message":`Every mod starts with mod.json: its name, version, authors, dependencies, and the features it needs. ShroudForge-specific switches, settings, buttons, and links live in the optional extended.mod.json. The Modloader can show those settings to players, and your Lua code can read them through the ShroudForge API. You do not need to learn every field at once. Start with the working Hello Ember template, then read the extended.mod.json guide to see how settings are defined and shown in the Modloader.`,"news.notice.discord.title":`A question, an idea, or just curious, {username}? 💬`,"news.notice.discord.message":`Have a question, an idea, or just want to see what others are building? The Enshrouded Modding Discord brings players and mod authors together to share and help out. You can just read along at first. Joining is completely optional.`,"news.notice.discord.join":`Join Discord`,"news.notice.applySettings.title":`All saved, {username} 🔧`,"news.notice.applySettings.message":`Your choice is saved as soon as you apply it. What happens next depends on the mod: runtime-only mods can use new settings straight away when their code reads the current value from a lifecycle or action callback. Changes to game files are prepared before the next launch, so close Enshrouded first. If the Modloader says a restart is needed, your change is saved and waiting for the next session.`,"news.notice.feedback.title":`Noticed something, {username}? 🐛`,"news.notice.feedback.message":`A bug, a confusing message, or something that feels harder than it should? Feel free to let us know. Small notes help make ShroudForge clearer and more reliable.

The most helpful details are your Enshrouded and ShroudForge versions, which mods were enabled, what you expected, and what happened instead. Steps to reproduce the issue make it much easier to investigate. A short log excerpt can help too.

Please remove personal information before sharing logs. If the issue only happens with one specific mod, please contact its author as well. The links below open the issue form and explain how ShroudForge mod logs work.`,"news.notice.support.title":`Enjoying ShroudForge? ☕`,"news.notice.support.message":`Hey {username}, it is lovely to see you trying ShroudForge! If you enjoy the project and would like to support my work on it, you can buy me a coffee. The contribution goes directly to me and supports my work on ShroudForge.

There is no expectation at all. Trying the loader, sharing feedback, or reporting an issue already helps the project a lot. Thank you! 💚`,"news.link.guide":`Open the getting started guide`,"news.link.eml":`Brabb3l's EML guide`,"news.link.kfc":`kfc-parser on GitHub`,"news.link.shroudtopia":`Shroudtopia on GitHub`,"news.link.firstMod":`Build your first mod`,"news.link.settings":`Read about mod settings`,"news.link.extendedModJson":`Read the extended.mod.json guide`,"news.link.api":`Open the API reference`,"news.link.playerGuide":`Read the player guide`,"news.link.modsGuide":`See what the included mods do`,"news.action.open-installed-mods":`View installed mods`,"news.link.reportIssue":`Report an issue`,"news.link.loggingGuide":`How ShroudForge mod logs work`,"news.link.buyCoffee":`Buy me a coffee`,"news.log.warning.title":`A log warning needs a quick look`,"news.log.warning.message":`{source} reported this warning {count}×: {excerpt}. Open the debug log to see the full entry and its context.`,"news.log.error.title":`This operation failed`,"news.log.error.message":`{source} reported the same error {count}×: {excerpt}. The debug log has the full entry. If a mod is involved, open its page too and check its current status.`,"news.modStatus.failed.title":`{name} could not start successfully`,"news.modStatus.failed.message":`The loader could not run this mod as expected. Reported reason: {detail}. Open the mod page to check its status and see whether a dependency, permission, or game version is in the way.`,"news.modStatus.blocked.title":`{name} is waiting on a requirement`,"news.modStatus.blocked.message":`The mod was skipped because a required dependency or compatible version is unavailable: {detail}. Open the mod page to see what needs to be installed or updated.`,"news.modStatus.restart.title":`A restart is queued for {name}`,"news.modStatus.restart.message":`Your change is saved, but it cannot become active in this session yet: {detail}. Restart Enshrouded so the loader
