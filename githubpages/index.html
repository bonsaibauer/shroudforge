<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050b14">
  <meta name="description" content="ShroudForge documentation has moved. Open the current page on the ShroudForge Wiki.">
  <title>Documentation has a new home | ShroudForge</title>
  <link rel="icon" href="{{ASSET_PREFIX}}media/hammer.png" type="image/png">
  <link rel="stylesheet" href="{{ASSET_PREFIX}}redirect.css">
  <script type="module" src="{{ASSET_PREFIX}}redirect.js"></script>
</head>
<body>
  <main class="site-shell">
    <div class="brand-wordmark" aria-label="ShroudForge">SHROUDFORGE</div>
    <h1>Documentation has a new home!</h1>

    <section class="redirect-card" aria-label="Documentation move">
      <div class="route-flow">
        <div class="endpoint old-endpoint">
          <span class="endpoint-label">OLD ADDRESS</span>
          <code id="old-url">GitHub Pages documentation</code>
        </div>

        <div class="arrow-track arrow-in" aria-hidden="true"><span></span></div>

        <div class="hammer-orbit" aria-label="ShroudForge hammer">
          <div class="hammer-ring"><img src="{{ASSET_PREFIX}}media/hammer.png" alt=""></div>
        </div>

        <div class="arrow-track arrow-out" aria-hidden="true"><span></span></div>

        <a class="endpoint new-endpoint" id="destination" href="https://wiki.shroudforge.net/index.php/Main_Page">
          <span class="endpoint-label">NEW HOME <span aria-hidden="true">↗</span></span>
          <span class="destination-title" id="destination-title">Open the ShroudForge Wiki</span>
          <code id="destination-url">https://wiki.shroudforge.net/index.php/Main_Page</code>
        </a>
      </div>
    </section>

    <p class="site-signature">SHROUDFORGE.NET <span aria-hidden="true">·</span> DOCUMENTATION</p>
  </main>
</body>
</html>
